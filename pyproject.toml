[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-context-llm-eval"
version = "0.1.0"
description = "Headset-free harness for context-aware LLM answers in MR scenes"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pydantic", "httpx"]

[tool.setuptools]
packages = ["mr_context"]
